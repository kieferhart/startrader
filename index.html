<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Trader — Solo Trading Game</title>
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

<div class="topbar">
  <h1>STAR<span>TRADER</span></h1>
  <div class="stat"><span class="lbl">Credits</span><span class="val" id="t-credits">—</span></div>
  <div class="stat"><span class="lbl">Net Profit</span><span class="val" id="t-profit">—</span></div>
  <div class="stat"><span class="lbl">Week</span><span class="val" id="t-week">—</span></div>
  <div class="stat"><span class="lbl">Day</span><span class="val" id="t-day">—</span></div>
  <div class="stat"><span class="lbl">Location</span><span class="val" id="t-loc">—</span></div>
  <div class="stat"><span class="lbl">Hold</span><span class="val" id="t-hold">—</span></div>
  <div class="spacer"></div>
  <button onclick="showShip()">Ship</button>
  <button onclick="showCrew()">Crew</button>
  <button onclick="showPeople()">People</button>
  <button onclick="showFinancials()">Financials</button>
  <button onclick="showHelp()">How to Play</button>
  <button onclick="showSettings()" title="AI settings (bring your own key)">⚙ AI</button>
  <button class="danger" onclick="confirmNewGame()">New Game</button>
</div>

<nav class="tabs">
  <button id="tabbtn-trade" class="on" onclick="switchTab('trade')">Trade</button>
  <button id="tabbtn-map" onclick="switchTab('map')">Star Map</button>
  <button id="tabbtn-bridge" onclick="switchTab('bridge')">Bridge</button>
</nav>

<main class="content">

  <!-- TRADE: world + market + hold -->
  <section class="tabpage active" id="tab-trade">
    <div class="card span">
      <h3>Current World — <span id="cw-name"></span></h3>
      <div class="body" id="cw-detail"></div>
    </div>
    <div class="card">
      <h3>Market <span class="pill" id="mkt-src"></span></h3>
      <div class="body">
        <div class="toolbar">
          <button class="primary" onclick="searchCargo('port')">Search at Starport (2 days)</button>
          <button onclick="searchCargo('away')">Search Away from Port (3 days)</button>
        </div>
        <div id="market"></div>
      </div>
    </div>
    <div class="card">
      <h3>Cargo Hold <span class="pill" id="hold-cap"></span></h3>
      <div class="body" id="hold"></div>
    </div>
  </section>

  <!-- STAR MAP -->
  <section class="tabpage" id="tab-map">
    <div class="card">
      <h3>Star Map <span class="pill" id="ss-name"></span></h3>
      <div class="body" style="padding:8px;">
        <div id="starmap"></div>
        <div class="hint" style="margin-top:6px;">Jump range <b id="jrange">J2</b>. Tap a world to set your destination — bright hexes are within range.</div>
        <div class="hint" style="margin-top:8px;">Destination: <b id="dest-name-m">none</b></div>
        <div class="row" style="margin-top:6px;">
          <button class="primary" id="jumpbtn-m" onclick="doJump()" disabled>Jump ▶</button>
          <span class="hint" id="jump-info-m"></span>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>World List</h3>
      <div class="body">
        <div class="worlds" id="worldlist"></div>
      </div>
    </div>
  </section>

  <!-- BRIDGE: actions + log -->
  <section class="tabpage" id="tab-bridge">
    <div class="card">
      <h3>Bridge Actions</h3>
      <div class="body">
        <div class="toolbar">
          <button onclick="doPortEvent()">Walk the Port (Port Event)</button>
          <button onclick="doMeetContact()">Look for Contacts</button>
        </div>
        <div class="hint">Selected destination: <b id="dest-name">none</b></div>
        <div class="row" style="margin-top:6px;">
          <button class="primary" id="jumpbtn" onclick="doJump()" disabled>Jump ▶</button>
          <span class="hint" id="jump-info"></span>
        </div>
        <div id="event-area"></div>
      </div>
    </div>
    <div class="card">
      <h3>Commitments</h3>
      <div class="body worlds" id="commitments"></div>
    </div>
    <div class="card">
      <h3>Ledger / Diary</h3>
      <div class="body log" id="log" style="max-height:60vh;overflow-y:auto;padding:0;"></div>
    </div>
  </section>

</main>

<!-- chat dock (bottom-left): roster + conversations; reactions land here -->
<div id="chatdock" class="chatdock" onclick="toggleChatPanel()" title="Comms"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9ec5ff" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="14.5" r="1.9" fill="#9ec5ff" stroke="none"/><path d="M12 16.5v4"/><path d="M8.6 11.2a4.8 4.8 0 0 1 6.8 0"/><path d="M6.2 8.6a8.2 8.2 0 0 1 11.6 0"/><path d="M3.8 6a11.6 11.6 0 0 1 16.4 0"/></svg><span id="chatbadge" class="chatbadge" style="display:none">0</span></div>
<div id="chatpanel" class="chatpanel" style="display:none">
  <div class="chathead" id="chathead"></div>
  <div class="chatbody" id="chatbody"></div>
  <div class="chatfoot" id="chatfoot"></div>
</div>

<!-- modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="body" id="modal-body"></div></div>
</div>

<!-- event pop-up (separate layer so it never collides with Ship/Crew/etc.) -->
<div class="modal-bg" id="ev-bg" style="z-index:60" onclick="if(event.target===this&&!EV_CHOICE)evNext()">
  <div class="modal evpop"><div class="body" id="ev-body"></div></div>
</div>

<script src="js/data.js?v=10"></script>
<script src="js/world.js?v=10"></script>
<script src="js/ship.js?v=10"></script>
<script src="js/game.js?v=10"></script>
<script src="js/events.js?v=10"></script>
<script src="js/npc.js?v=10"></script>
<script src="js/people.js?v=10"></script>
<script src="js/ai.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/main.js?v=10"></script>
</body>
</html>
